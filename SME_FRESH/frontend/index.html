<!DOCTYPE html>
<html>
<head>
    <title>Upload Excel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Upload Excel File</h1>

        <input type="file" id="fileInput" accept=".xlsx" />
        <button onclick="uploadFile()">Upload</button>

        <div id="message"></div>

        <a href="dashboard.html" class="nav-link"> Go to Dashboard </a>
    </div>

<script>
function uploadFile() {
    let fileInput = document.getElementById("fileInput");
    let msg = document.getElementById("message");

    if (!fileInput.files.length) {
        msg.innerHTML = "<div class='error'> Please select a file!</div>";
        return;
    }

    let formData = new FormData();
    formData.append("file", fileInput.files[0]);

    fetch("http://127.0.0.1:8000/api/upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            msg.innerHTML = "<div class='success'>✅ File uploaded successfully!</div>";
        } else {
            msg.innerHTML = "<div class='error'>❌ Upload failed!</div>";
        }
    })
    .catch(() => {
        msg.innerHTML = "<div class='error'>❌ Could not reach backend!</div>";
    });
}
</script>
</body>
</html>
